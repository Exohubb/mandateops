<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MandateOps — UPI AutoPay Retry Sequencer</title>
    <meta
      name="description"
      content="A constraint-aware UPI AutoPay mandate retry sequencer built for the Razorpay Buildathon, Track 03: AI Revenue Recovery."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mandateops-theme");
          var isDark =
            stored === "dark" ||
            (!stored && !window.matchMedia("(prefers-color-scheme: light)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
